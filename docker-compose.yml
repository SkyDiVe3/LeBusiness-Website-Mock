name: doingbusiness

services:
  caddy:
    image: caddy:2.10-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:8080
      DATABASE_URL: postgresql://doingbusiness:doingbusiness@postgres:5432/doingbusiness
      REDIS_URL: redis://valkey:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-change-me-before-shared-use}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-doingbusiness}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-before-shared-use}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://doingbusiness:doingbusiness@postgres:5432/doingbusiness
      REDIS_URL: redis://valkey:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-change-me-before-shared-use}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doingbusiness
      POSTGRES_USER: doingbusiness
      POSTGRES_PASSWORD: doingbusiness
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doingbusiness -d doingbusiness"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - valkey_data:/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-change-me-before-shared-use}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-doingbusiness}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-before-shared-use}
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.25
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
  meilisearch_data:
  minio_data:
